<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src blob:">
<title>動画からキャラクターを作る - AgentWingman</title>
<style>
  :root { --bg: #14181e; --panel: #1d232b; --line: #2e3a47; --text: #e3e8ee; --mute: #8494a6; --amber: #f2a20c; --ok: #4cc38a; --bad: #ff6b5e;
    --f: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 var(--f); }
  main { max-width: 980px; margin: 0 auto; padding: 18px 20px 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 18px; }
  .lead { color: var(--mute); margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  label { color: var(--mute); }
  input[type=text], select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: inherit; }
  input[type=text] { width: 220px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  th { color: var(--mute); font-weight: 400; font-size: 12px; }
  td.name b { display: block; }
  td.name small { color: var(--mute); }
  .drop { border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; min-width: 240px; cursor: pointer; color: var(--mute); }
  .drop.has { border-style: solid; color: var(--text); }
  .drop.over { border-color: var(--amber); background: rgba(242, 162, 12, .08); }
  .drop .clear { float: right; color: var(--mute); background: none; border: 0; cursor: pointer; font: inherit; }
  canvas.thumb { width: 72px; height: 72px; background: repeating-conic-gradient(#2a3038 0 25%, #20252c 0 50%) 0 0 / 12px 12px; border-radius: 4px; }
  .st { font-size: 12px; color: var(--mute); }
  .st.ok { color: var(--ok); } .st.bad { color: var(--bad); }
  button.main { background: var(--amber); color: #1a1100; border: 0; border-radius: 4px; padding: 8px 18px; font: 700 14px var(--f); cursor: pointer; }
  button.main:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 1.5em; }
  .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
  progress { width: 260px; }
  .note { color: var(--mute); font-size: 12px; border-left: 3px solid var(--line); padding-left: 10px; }
  .row.video { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  #ffGet { background: transparent; color: var(--amber); border: 1px solid var(--amber); border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>動画からキャラクターを作る</h1>
  <p class="lead">状態ごとに、動画・GIF・アニメ PNG / WebP・連番画像（複数選択）・静止画のどれかを入れてください。
    待機だけは必須です。空けた状態は近い状態のものを使います。動画は同じキャラクター・同じ大きさ・同じ構図で作ったものを使うときれいにそろいます。</p>

  <div class="row">
    <label for="name">名前</label><input type="text" id="name" value="マイキャラクター">
    <label for="bg">背景</label>
    <select id="bg">
      <option value="auto">自動（透明ならそのまま、単色なら抜く）</option>
      <option value="keep">透明のまま（抜かない）</option>
      <option value="color">色を指定して抜く</option>
    </select>
    <input type="color" id="bgColor" value="#00ff00" hidden>
    <label for="tol">抜く強さ</label><input type="range" id="tol" min="20" max="160" value="80">
    <label for="fps">コマ数</label>
    <select id="fps"><option value="12" selected>1秒 12 コマ（軽い）</option><option value="24">1秒 24 コマ（なめらか）</option></select>
    <label for="pingpong"><input type="checkbox" id="pingpong"> 往復再生でつなぎ目を消す</label>
  </div>

  <div class="row video">
    <label for="video"><input type="checkbox" id="video"> 動画（透過 WebM）でも書き出す（なめらか・軽い。おすすめ）</label>
    <span class="st" id="ffStatus">ffmpeg を確認中…</span>
    <button type="button" id="ffGet" hidden>ffmpeg をダウンロードして動画を作れるようにする（約160MB）</button>
    <progress id="ffProg" max="1" value="0" hidden></progress>
  </div>

  <table>
    <thead><tr><th>状態</th><th>素材（クリックで選ぶ／ドロップ）</th><th>仕上がり</th><th></th></tr></thead>
    <tbody id="slots"></tbody>
  </table>

  <div class="row">
    <button class="main" id="make" disabled>作成する</button>
    <progress id="prog" max="1" value="0" hidden></progress>
    <span class="msg" id="msg"></span>
  </div>
  <p class="note">作ったキャラクターは「ユーザー用キャラクターフォルダ」に保存され、すぐにそのキャラクターに切り替わります。
    動きは素材の動画のまま使うので、体の揺れはアプリ側では付けません（記号の「…」「！」などは付きます）。休止は灰色で表示されます。</p>
</main>
<input type="file" id="picker" hidden multiple accept="video/*,image/*,.gif,.webp,.apng,.png,.webm,.mp4,.mov">
<script src="maker.js"></script>
</body>
</html>
