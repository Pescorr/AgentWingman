<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Pose guide</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Static poses of the built-in pilot, exported by `npm run export-guide`. */
  * { animation: none !important; transition: none !important; }
  html, body { background: transparent; }
  body { --lamp: #4cc38a; }
  body.green { background: #00ff00; }
  .cell { position: relative; width: 512px; height: 512px; }
  .cell .pilot-svg { left: 36px; top: 16px; width: 440px; height: 480px; }
  .cell .shadow { display: none; } /* the app draws a shadow under image skins */
  .cell b { display: none; }
  .keys { opacity: 0; }
  .cell[data-pose^="type"] .keys { opacity: 1; }
  .cell[data-pose="blink"] .eye { transform: scaleY(.1); }
  .cell[data-pose="read"] .eyes { transform: translateX(4px); }
  .cell[data-pose="think"] .eyes { transform: translate(3px, -4px); }
  .cell[data-pose="type1"] .eyes, .cell[data-pose="type2"] .eyes { transform: translateY(3px); }
  .cell[data-pose="type1"] .arm-l { transform: rotate(-24deg); }
  .cell[data-pose="type1"] .arm-r { transform: rotate(40deg) translateY(-2px); }
  .cell[data-pose="type2"] .arm-l { transform: rotate(-40deg) translateY(-2px); }
  .cell[data-pose="type2"] .arm-r { transform: rotate(24deg); }
  .cell[data-pose="question"] .arm-r { transform: rotate(-150deg); }
  .cell[data-pose="wave1"] .arm-r { transform: rotate(-120deg); }
  .cell[data-pose="wave2"] .arm-r { transform: rotate(-170deg); }
  .cell[data-pose="cheer"] .arm-l { transform: rotate(150deg); }
  .cell[data-pose="cheer"] .arm-r { transform: rotate(-150deg); }
  .cell[data-pose="cheer"] .eye { transform: scaleY(.35); }
  .cell[data-pose="error"] { --eye: #ff8080; --lamp: #ff4d4d; }
  .cell[data-pose="error"] .eye { transform: scaleY(.25); }
  .cell[data-pose="sleep"] { --lamp: #3d4a57; }
  .cell[data-pose="sleep"] .eye { transform: scaleY(.12); }

  .sheet { display: grid; grid-template-columns: repeat(4, 256px); background: #fff; }
  .sheet .cell { width: 256px; height: 256px; outline: 1px solid #c9ced6; }
  .sheet .cell .pilot-svg { left: 30px; top: 34px; width: 196px; height: 214px; }
  .sheet .cell b { display: block; position: absolute; left: 8px; top: 6px; font: 700 15px/1.2 "BIZ UDPGothic", sans-serif; color: #2a3340; }
  .sheet .cell b small { display: block; font-weight: 400; font-size: 12px; color: #6b7685; }
</style>
</head>
<body>
<div id="root"></div>
<script src="pilot.js"></script>
<script src="guide.js"></script>
</body>
</html>
